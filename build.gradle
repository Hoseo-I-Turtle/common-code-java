plugins {
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}" apply false
}

// main 은 지원 하한(springBootVersion)으로 한 번만 컴파일하고, 테스트만 -PtestBootVersion 으로 지정한 Boot 에서 돌린다
ext.testBootVersion = findProperty('testBootVersion') ?: springBootVersion
ext.isTestBoot4 = testBootVersion.startsWith('4.')
// Spring Cloud AWS 는 Boot 버전별로 맞는 버전이 다르다
ext.testCloudAwsVersion = findProperty('testCloudAwsVersion') ?: [
        '3.5': '3.4.2',
        '4.0': '4.0.2',
        '4.1': '4.2.1'
].getOrDefault(testBootVersion.tokenize('.').take(2).join('.'), springCloudAwsVersion)

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    // 테스트만 -PtestBootVersion 의 Boot BOM 으로 해석한다 (main 은 각 모듈의 springBootVersion BOM)
    plugins.withId('io.spring.dependency-management') {
        dependencyManagement {
            testImplementation {
                imports {
                    mavenBom "org.springframework.boot:spring-boot-dependencies:${testBootVersion}"
                }
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
    }

    repositories {
        mavenCentral()
    }

    // 모든 모듈 공통
    dependencies {
        // Lombok: 컴파일 때만 쓰고 jar 에는 들어가지 않는다
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
        testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

        // JUnit. Boot BOM 을 쓰는 모듈에서는 테스트하는 Boot 의 버전으로 바뀐다
        testImplementation platform('org.junit:junit-bom:5.10.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
        // 최소 Java 버전으로 컴파일해 그 이상의 모든 Java 에서 쓸 수 있게 한다. 테스트 코드는 toolchain 그대로
        if (name != 'compileTestJava') {
            options.release = minJavaVersion as int
        }
    }

    test {
        useJUnitPlatform()
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
            }
        }
    }
}
