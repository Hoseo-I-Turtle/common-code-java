// 인프라(오브젝트 스토리지 등) 공통 코드. 인프라 SDK 는 compileOnly 로 두고 서비스가 필요한 것만 추가한다
apply plugin: 'io.spring.dependency-management'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
    }
}

dependencies {
    api project(':common-core')

    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'

    // 스토리지: type=s3 는 AWS SDK, type=minio 는 MinIO SDK 를 서비스가 추가한다
    compileOnly 'software.amazon.awssdk:s3'
    compileOnly "io.minio:minio:${minioVersion}"

    // Redis: 연결 / StringRedisTemplate 은 서비스의 spring-boot-starter-data-redis 가 만든다
    compileOnly 'org.springframework.data:spring-data-redis'
    compileOnly 'org.slf4j:slf4j-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'software.amazon.awssdk:s3'
    testImplementation "io.minio:minio:${minioVersion}"
    testImplementation 'org.springframework.data:spring-data-redis'
    // 실제 서버 테스트 (Docker 가 없으면 건너뜀). 버전은 Boot BOM
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'io.lettuce:lettuce-core'
}
