// 인프라 공통 코드 (오브젝트 스토리지, Redis, SQS). 인프라 SDK 는 서비스가 쓰는 것만 직접 추가한다. 빈 등록은 common-infra-starter 가 한다
apply plugin: 'io.spring.dependency-management'

dependencyManagement {
    imports {
        // 버전만 맞춘다. 실제 버전은 서비스의 Spring Boot / AWS SDK 를 따른다
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
    }
}

dependencies {
    // 모듈
    api project(':common-core')

    // 서비스가 제공 (compileOnly). 모든 서비스가 모든 SDK 를 받지 않도록 api 로 두지 않는다
    compileOnly 'org.springframework.boot:spring-boot'                              // StorageProperties 등 (@ConfigurationProperties)
    compileOnly 'org.slf4j:slf4j-api'                                               // 로그
    compileOnly 'software.amazon.awssdk:s3'                                         // 스토리지 type=s3
    compileOnly "io.minio:minio:${minioVersion}"                                    // 스토리지 type=minio
    compileOnly 'org.springframework.data:spring-data-redis'                        // RedisStore. 연결은 서비스의 spring-boot-starter-data-redis
    compileOnly "io.awspring.cloud:spring-cloud-aws-sqs:${springCloudAwsVersion}"   // SQS. 클라이언트 / 리스너는 서비스의 spring-cloud-aws-starter-sqs

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.data:spring-data-redis'
    testImplementation 'io.lettuce:lettuce-core'
    // 실제 서버 테스트 (Docker 가 없으면 건너뜀). Boot 4 의 Testcontainers 2 에서 모듈 이름이 바뀌었다
    testImplementation isTestBoot4 ? 'org.testcontainers:testcontainers-junit-jupiter' : 'org.testcontainers:junit-jupiter'
}
