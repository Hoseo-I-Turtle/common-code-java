// Spring Web 공통 코드
apply plugin: 'io.spring.dependency-management'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    api project(':common-spring-core')

    compileOnly 'org.springframework:spring-web'
    compileOnly 'org.springframework.boot:spring-boot'
    compileOnly 'org.slf4j:slf4j-api'
    // 검증 어노테이션 / ConstraintViolationException 처리. 없는 서비스에서도 동작하도록 compileOnly
    compileOnly 'jakarta.validation:jakarta.validation-api'
    // PageResponse.from(Page) 에서만 사용
    compileOnly 'org.springframework.data:spring-data-commons'
    // 컨트롤러 안의 Security 예외(@PreAuthorize 거부 등) 판단에서만 사용
    compileOnly 'org.springframework.security:spring-security-core'
    // ErrorResponse 의 @JsonInclude. Jackson 이 없으면 어노테이션은 무시된다
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.data:spring-data-commons'
    testImplementation 'org.springframework.security:spring-security-core'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.springframework:spring-web'
}
