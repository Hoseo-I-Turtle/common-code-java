group=com.iturtle
version=1.0-SNAPSHOT

# 서비스의 최소 Java 버전. 이 버전으로 컴파일하므로 이 버전 이상의 모든 Java 에서 쓸 수 있다
minJavaVersion=17

# 컴파일 기준. 지원 하한으로 컴파일해 그보다 새로운 API 를 실수로 쓰지 않게 한다. 다른 Boot 에서의 테스트는 README 의 빌드 항목 참고
springBootVersion=3.4.13
# common-spring-webmvc 의 Boot 4 전용 코드(src/boot4) 컴파일 기준
springBoot4Version=4.0.9
springDependencyManagementVersion=1.1.7
lombokVersion=1.18.42
# Spring Boot BOM 이 관리하지 않으므로 Spring Security(6.5.x) 가 쓰는 버전에 맞춘다
nimbusJoseJwtVersion=9.37.4
# Spring Boot BOM 이 관리하지 않는 인프라 SDK (common-infra, compileOnly)
awsSdkVersion=2.55.10
minioVersion=8.6.0
# Spring Boot 3.4 용. BOM 은 AWS SDK 를 2.31 로 고정하므로 import 하지 않고 버전만 지정한다
springCloudAwsVersion=3.3.1
# Boot 4 의 Jackson 3 (common-spring-security-webmvc, compileOnly). Boot 3 BOM 이 관리하지 않으므로 버전을 지정한다
jackson3Version=3.1.7
