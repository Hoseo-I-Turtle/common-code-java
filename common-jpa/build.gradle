// JPA 공통 코드 (생성 / 수정 / 삭제 시각과 사용자 기록, soft delete). 빈 등록과 테스트는 common-jpa-starter 에 있다
apply plugin: 'io.spring.dependency-management'

dependencyManagement {
    imports {
        // 버전만 맞춘다. 실제 버전은 서비스의 Spring Boot 를 따른다
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    // 모듈
    api project(':common-core')

    // 서비스가 제공 (compileOnly)
    compileOnly 'jakarta.persistence:jakarta.persistence-api'         // 엔티티 매핑
    compileOnly 'org.springframework.data:spring-data-jpa'            // Auditing (@CreatedDate 등)
    compileOnly 'org.hibernate.orm:hibernate-core'                    // @JdbcTypeCode: 제네릭 타입 / payload 를 문자열로 저장
    compileOnly 'org.springframework.security:spring-security-core'   // createdBy / updatedBy 를 로그인 사용자로 채울 때 (선택)
}
