// Spring MVC + Security / JWT 서비스용 스타터. common-spring-security(-webmvc) 를 묶고 그 빈을 자동 설정으로 등록한다.
// common-webmvc-starter 를 포함한다. Spring Boot starter 는 서비스가 직접 추가한다
apply plugin: 'io.spring.dependency-management'

dependencyManagement {
    imports {
        // 버전만 맞춘다. 실제 버전은 서비스의 Spring Boot 를 따른다
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    // 모듈
    api project(':common-webmvc-starter')
    api project(':common-spring-security-webmvc')

    // 서비스가 제공 (compileOnly)
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'      // 자동 설정
    compileOnly 'org.springframework.security:spring-security-web'        // entry point, denied handler
    compileOnly 'com.fasterxml.jackson.core:jackson-databind'             // Boot 3 의 Jackson 2
    compileOnly "tools.jackson.core:jackson-databind:${jackson3Version}"  // Boot 4 의 Jackson 3

    // 테스트 (실제 Tomcat + 자동 설정 + Security 체인)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    if (isTestBoot4) {
        testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    } else {
        testImplementation 'org.springframework.boot:spring-boot-starter-web'
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-security'
}

test {
    useJUnitPlatform {
        excludeTags 'jackson3-only'
    }
}

// Boot 4 기본 구성(Jackson 3 만 있음)에서 자동 설정이 동작하는지 Jackson 2 를 뺀 클래스패스로 검증한다
if (isTestBoot4) {
    tasks.register('testJackson3Only', Test) {
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('jackson-databind-2') }
        useJUnitPlatform {
            includeTags 'jackson3-only'
        }
    }
    test.finalizedBy 'testJackson3Only'
}
