// 인프라(오브젝트 스토리지 / Redis / SQS)를 쓰는 서비스용 스타터. common-infra 를 묶고 그 빈을 자동 설정으로 등록한다.
// 인프라 SDK 와 Spring Boot starter 는 서비스가 직접 추가한다
apply plugin: 'io.spring.dependency-management'

dependencyManagement {
    imports {
        // 버전만 맞춘다. 실제 버전은 서비스의 Spring Boot / AWS SDK 를 따른다
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
    }
}

dependencies {
    // 모듈
    api project(':common-infra')

    // 서비스가 제공 (compileOnly). 인프라별 자동 설정은 SDK 가 있을 때만 켜진다
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'                // 자동 설정
    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'   // 자동 설정 조건 메타데이터 생성
    compileOnly 'software.amazon.awssdk:s3'                                         // S3 클라이언트 생성
    compileOnly "io.minio:minio:${minioVersion}"                                    // MinIO 클라이언트 생성
    compileOnly 'org.springframework.data:spring-data-redis'                        // StringRedisTemplate 조건
    compileOnly "io.awspring.cloud:spring-cloud-aws-sqs:${springCloudAwsVersion}"   // SqsTemplate / 리스너 팩토리

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'software.amazon.awssdk:s3'
    testImplementation "io.minio:minio:${minioVersion}"
    testImplementation 'org.springframework.data:spring-data-redis'
    testImplementation "io.awspring.cloud:spring-cloud-aws-starter-sqs:${testCloudAwsVersion}"
    // 실제 서버 테스트 (Docker 가 없으면 건너뜀). Boot 4 의 Testcontainers 2 에서 모듈 이름이 바뀌었다
    testImplementation isTestBoot4 ? 'org.testcontainers:testcontainers-junit-jupiter' : 'org.testcontainers:junit-jupiter'
}
